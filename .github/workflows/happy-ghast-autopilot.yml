name: happy-ghast-autopilot

on:
  push:
    paths:
      - 'happy-ghast-autopilot/**'
      - '.github/workflows/happy-ghast-autopilot.yml'
  pull_request:
    paths:
      - 'happy-ghast-autopilot/**'
      - '.github/workflows/happy-ghast-autopilot.yml'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: happy-ghast-autopilot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
          cache-dependency-path: |
            happy-ghast-autopilot/build.gradle
            happy-ghast-autopilot/gradle.properties
            happy-ghast-autopilot/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test mod
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build > build-output.log 2>&1
          build_status=$?
          cat build-output.log
          if [ "$build_status" -ne 0 ]; then
            {
              mc_jar=$(find ~/.gradle/caches -type f -name "*.jar" ! -name "*-sources.jar" -exec sh -c 'jar tf "$1" 2>/dev/null | grep -q "^net/minecraft/world/entity/animal/happyghast/HappyGhast.class$"' _ {} \; -print -quit)
              if [ -n "$mc_jar" ]; then
                echo "=== Minecraft methods ==="
                javap -cp "$mc_jar" -p net.minecraft.client.Minecraft 2>/dev/null | grep -E "screen|Screen|gui|getWindow" | head -n 30
                echo "=== Gui methods ==="
                javap -cp "$mc_jar" -p net.minecraft.client.gui.Gui 2>/dev/null | grep -E "screen|Screen|Overlay|hud|Hidden" | head -n 30
                echo "=== Options hideGui ==="
                javap -cp "$mc_jar" -p net.minecraft.client.Options 2>/dev/null | grep -E "hideGui|keyUp|keyDown" | head -n 20
                echo "=== HappyGhast ==="
                javap -cp "$mc_jar" -p net.minecraft.world.entity.animal.happyghast.HappyGhast 2>/dev/null | head -n 50
              fi
            } > api-probe.log 2>&1
            python3 - <<'PY'
          from pathlib import Path

          def emit(level, title, body):
              body = body[-3500:]
              escaped = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title={title}::{escaped}")

          lines = Path("build-output.log").read_text(errors="replace").splitlines()
          emit("error", "Build log tail", "\n".join(lines[-90:]))
          errors = [l for l in lines if ("error:" in l or "FAILED" in l or "Caused by:" in l or "AssertionFailedError" in l)]
          if errors:
              emit("error", "Errors summary", "\n".join(errors[:80]))

          chunks, cur = [], []
          for i, l in enumerate(lines):
              if "error:" in l or "FAILED" in l:
                  block = "\n".join(lines[max(0, i-1):i+5])
                  if sum(len(x) for x in cur) + len(block) > 3000:
                      chunks.append("\n\n".join(cur))
                      cur = []
                  cur.append(block)
          if cur:
              chunks.append("\n\n".join(cur))
          for idx, ch in enumerate(chunks[:5]):
              emit("error", f"Error context {idx+1}", ch)

          probe = Path("api-probe.log").read_text(errors="replace").strip()
          if probe:
              emit("notice", "MC 26.3 API probe", probe[:3500])
          PY
            exit "$build_status"
          fi

      - name: Verify bytecode against Minecraft 26.3 and Xaero's World Map 26.3
        if: success()
        shell: bash
        run: |
          set +e
          main_jar=$(find build/libs -maxdepth 1 -type f -name 'happy-ghast-autopilot-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$main_jar" || exit 1

          {
            ls -lh build/libs
            echo "--- JAR entries ---"
            jar tf "$main_jar"
            echo "--- Test results ---"
            grep -E "testsuite " build/test-results/test/*.xml 2>/dev/null || true
          } > report-jar.txt 2>&1

          mc_jar=$(find ~/.gradle/caches -type f -name "*.jar" ! -name "*-sources.jar" -exec sh -c 'jar tf "$1" 2>/dev/null | grep -q "^net/minecraft/world/entity/animal/happyghast/HappyGhast.class$"' _ {} \; -print -quit)
          {
            if [ -n "$mc_jar" ]; then
              javap -cp "$mc_jar" -c -p net.minecraft.world.entity.animal.happyghast.HappyGhast > raw-ghast.txt
              python3 - <<'PY'
          from pathlib import Path
          txt = Path("raw-ghast.txt").read_text(errors="replace")
          lines = txt.splitlines()
          want = ("getRiddenRotation(", "tickRidden(")
          printing = False
          for line in lines:
              if line.startswith("  ") and not line.startswith("    "):
                  printing = any(w in line for w in want)
              if printing:
                  print(line)
          PY
            fi
          } > report-ghast.txt 2>&1

          xaero_jar=$(find ~/.gradle/caches -type f \( -name "*NcUtCpym*.jar" -o -name "*xaeroworldmap*.jar" \) ! -name "*-sources.jar" | head -n 1)
          {
            if [ -n "$xaero_jar" ]; then
              javap -cp "$xaero_jar" -c -p xaero.map.mods.gui.Waypoint > raw-wp.txt
              python3 - <<'PY'
          from pathlib import Path
          for name, path, targets in [
              ("Waypoint", "raw-wp.txt", ("getX(", "getY(", "getZ(", "getRenderX(", "getRenderZ(", "isyIncluded(")),
          ]:
              lines = Path(path).read_text(errors="replace").splitlines()
              p = False
              for l in lines:
                  if l.startswith("  ") and not l.startswith("    "):
                      p = any(t in l for t in targets)
                  if p:
                      print(l)
          PY
              echo "--- RightClickOption methods ---"
              javap -cp "$xaero_jar" -p xaero.map.gui.dropdown.rightclick.RightClickOption
              echo "--- GuiRightClickMenu methods ---"
              javap -cp "$xaero_jar" -c -p xaero.map.gui.dropdown.rightclick.GuiRightClickMenu | head -n 65
            fi
          } > report-xaero.txt 2>&1

          {
            if [ -n "$xaero_jar" ]; then
              javap -cp "$xaero_jar" -c -p xaero.map.gui.GuiMap > raw-guimap.txt
              python3 - <<'PY'
          from pathlib import Path
          lines = Path("raw-guimap.txt").read_text(errors="replace").splitlines()
          p = False
          out = []
          for l in lines:
              if l.startswith("  ") and not l.startswith("    "):
                  p = "getRightClickOptions(" in l
              if p and ("rightClick" in l or "String " in l or "32767" in l or "ldc" in l or "invokevirtual" in l):
                  out.append(l)
          print("\n".join(out[:80]))
          PY
            fi
          } > report-xaero2.txt 2>&1

          python3 - <<'PY'
          from pathlib import Path
          def emit(title, path):
              t = Path(path).read_text(errors="replace")[:3500]
              esc = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={title}::{esc}")
          emit("JAR and Tests", "report-jar.txt")
          emit("HappyGhast 26.3 bytecode", "report-ghast.txt")
          emit("Xaero 26.3 API", "report-xaero.txt")
          emit("Xaero rightClick bytecode", "report-xaero2.txt")
          PY
          exit 0

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-autopilot-26.3
          path: happy-ghast-autopilot/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-autopilot]')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built mod JARs
        uses: actions/download-artifact@v4
        with:
          name: happy-ghast-autopilot-26.3
          path: happy-ghast-autopilot/build/libs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: happy-ghast-autopilot
        shell: bash
        run: |
          set +e
          mod_version=$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties)
          minecraft_version=$(awk -F= '$1 == "minecraft_version" {print $2}' gradle.properties)
          release_tag="happy-ghast-autopilot-${mod_version}+${minecraft_version}"
          artifact=$(find build/libs -maxdepth 1 -type f -name 'happy-ghast-autopilot-*.jar' ! -name '*-sources.jar' -print -quit)
          if [ -z "$artifact" ]; then
            echo "::error title=Release error::No mod jar found in build/libs"
            exit 1
          fi
          sha=$(sha256sum "$artifact" | awk '{print $1}')

          cat > release-notes.md <<EOF
          **Happy Ghast Autopilot ${mod_version} — автопилот для добрых гастов (Minecraft ${minecraft_version}, Fabric).**

          ### Совместимость
          * Minecraft **${minecraft_version}**
          * Fabric Loader **0.19.5+**, Fabric API **0.166.2+26.3**
          * Java **25**
          * **Xaero's World Map** (для 26.3 — рекомендуется для выбора точки на карте) + поддержка меток Xaero's Minimap на карте мира
          * **Mod Menu** (опционально — открывает меню настроек)
          * Клиентский мод — работает и в одиночной игре, и на серверах.

          ### Возможности
          * **Выбор точки прямо на Xaero's World Map:** откройте карту мира Xaero, нажмите **ПКМ** по нужной точке и выберите **«Лететь на гасте (X, Z)»** (полёт на крейсерской высоте) или **«Лететь с посадкой (X, Y, Z)»** (плавное снижение к поверхности в точке прибытия). Также работает **ПКМ по любой метке (вейпоинту)** на карте!
          * **Маршрут и прицел на карте:** отображает пунктирную линию полёта и маркер точки назначения с дистанцией прямо на Xaero's World Map.
          * **Умный автопилот и обход препятствий:** автоматический набор высоты над горами и лесами, безопасный обход препятствий в Незере и под потолками, защита от лавы/огня и непрогруженных чанков, плавное торможение у цели.
          * **Свободный обзор (Free Look):** спокойно осматривайтесь вокруг, открывайте инвентарь, чат или Xaero's World Map прямо в полёте. Нажатие WASD мгновенно ставит автопилот на паузу.
          * **HUD, меню и команды:** панель с дистанцией, скоростью (бл/с) и расчётным временем прибытия (ETA), русская и английская локализация.

          ### Управление
          * **ПКМ на Xaero's World Map** — выбрать точку полёта / метку / сбросить цель
          * **\`G\`** — включить / поставить на паузу автопилот *(перенастраивается в управлении)*
          * **\`H\`** — открыть меню автопилота *(ввод координат, вставка F3+C и вейпоинтов Xaero из буфера, недавние цели, настройки)*
          * **\`/gp <x> <z>\`** или **\`/gp <x> <y> <z>\`** — задать координаты и полететь (\`/gp stop\`, \`/gp resume\`, \`/gp clear\`, \`/gp altitude <y|auto>\`, \`/gp clearance <блоки>\`, \`/gp freelook <true|false>\`, \`/gp descend <true|false>\`, \`/gp status\`)

          ### Установка
          Поместите \`happy-ghast-autopilot-${mod_version}.jar\` в папку \`.minecraft/mods/\` (требуются Fabric Loader 0.19.5+ и Fabric API для Minecraft 26.3; для выбора точки на карте — Xaero's World Map для 26.3).

          \`SHA-256: ${sha}\`
          EOF
          sed -i 's/^          //' release-notes.md

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$artifact" --clobber --repo "$GITHUB_REPOSITORY" > release.log 2>&1 \
              && gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --title "Happy Ghast Autopilot ${mod_version} for Minecraft ${minecraft_version}" \
                --notes-file release-notes.md >> release.log 2>&1
            st=$?
          else
            gh release create "$release_tag" "$artifact" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Happy Ghast Autopilot ${mod_version} for Minecraft ${minecraft_version}" \
              --notes-file release-notes.md > release.log 2>&1
            st=$?
          fi
          cat release.log
          if [ "$st" -ne 0 ]; then
            python3 -c "import pathlib; t=pathlib.Path('release.log').read_text(errors='replace')[-3000:]; print('::error title=Release failed::'+t.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))"
            exit "$st"
          fi
