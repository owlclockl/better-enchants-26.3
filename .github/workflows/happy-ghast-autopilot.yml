# Build, test, and release Happy Ghast Autopilot for Minecraft 26.3 (Fabric).
name: happy-ghast-autopilot

on:
  push:
    paths:
      - 'happy-ghast-autopilot/**'
      - '.github/workflows/happy-ghast-autopilot.yml'
  pull_request:
    paths:
      - 'happy-ghast-autopilot/**'
      - '.github/workflows/happy-ghast-autopilot.yml'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: happy-ghast-autopilot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
          cache-dependency-path: |
            happy-ghast-autopilot/build.gradle
            happy-ghast-autopilot/gradle.properties
            happy-ghast-autopilot/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build > build-output.log 2>&1
          build_status=$?
          cat build-output.log
          if [ "$build_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("build-output.log").read_text(errors="replace").splitlines()
          tail = "\n".join(lines[-90:])[-3500:]
          esc = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failed::{esc}")
          PY
            exit "$build_status"
          fi

      - name: Verify built JAR and test report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          main_jar=$(find build/libs -maxdepth 1 -type f -name 'happy-ghast-autopilot-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$main_jar"
          {
            ls -lh build/libs
            sha256sum "$main_jar"
            echo "--- fabric.mod.json ---"
            unzip -p "$main_jar" fabric.mod.json
            echo "--- Test suite ---"
            grep -E "<testsuite " build/test-results/test/*.xml
          } > jar-report.txt
          cat jar-report.txt
          python3 - <<'PY'
          from pathlib import Path
          t = Path("jar-report.txt").read_text(errors="replace")[:3500]
          esc = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Built JAR and Tests::{esc}")
          PY

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-autopilot-26.3
          path: happy-ghast-autopilot/build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-autopilot]')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built mod JARs
        uses: actions/download-artifact@v4
        with:
          name: happy-ghast-autopilot-26.3
          path: happy-ghast-autopilot/build/libs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: happy-ghast-autopilot
        shell: bash
        run: |
          set +e
          mod_version=$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties)
          minecraft_version=$(awk -F= '$1 == "minecraft_version" {print $2}' gradle.properties)
          release_tag="happy-ghast-autopilot-${mod_version}+${minecraft_version}"
          artifact=$(find build/libs -maxdepth 1 -type f -name 'happy-ghast-autopilot-*.jar' ! -name '*-sources.jar' -print -quit)
          if [ -z "$artifact" ]; then
            echo "::error title=Release error::No mod jar found in build/libs"
            exit 1
          fi
          sha=$(sha256sum "$artifact" | awk '{print $1}')

          cat > release-notes.md <<EOF
          **Happy Ghast Autopilot ${mod_version} — автопилот для добрых гастов (Minecraft ${minecraft_version}, Fabric).**

          ### Совместимость
          * Minecraft **${minecraft_version}**
          * Fabric Loader **0.19.5+**, Fabric API **0.166.2+26.3**
          * Java **25**
          * **Xaero's World Map** (для 26.3 — выбор точки и маршрут прямо на карте) + поддержка меток Xaero's Minimap
          * **Mod Menu** (опционально — открывает меню настроек)
          * Полностью клиентский мод — работает и в одиночной игре, и на серверах.

          ### Возможности
          * **Выбор точки прямо на Xaero's World Map:** откройте карту мира Xaero, нажмите **ПКМ** по нужной точке и выберите **«Лететь на гасте (X, Z)»** (крейсерский полёт) или **«Лететь с посадкой (X, Y, Z)»** (плавное снижение к поверхности в точке прибытия). Также работает **ПКМ по любой метке (вейпоинту)** на карте мира!
          * **Маршрут и метка на карте:** отображает пунктирную линию полёта и маркер точки назначения с дистанцией прямо на Xaero's World Map.
          * **Умный автопилот и обход препятствий:** автоматический взлёт и набор высоты над горами/лесами, обход препятствий в Незере и под потолками, защита от лавы/огня и непрогруженных чанков, плавное торможение у цели.
          * **Свободный обзор (Free Look):** спокойно осматривайтесь по сторонам, открывайте инвентарь, чат или Xaero's World Map прямо в полёте. Нажатие WASD мгновенно ставит автопилот на паузу.
          * **HUD, меню и команды:** панель с дистанцией, скоростью (бл/с) и расчётным временем прибытия (ETA), полная русская и английская локализация.

          ### Управление
          * **ПКМ на Xaero's World Map** — выбрать точку полёта / полететь к метке / сбросить цель
          * **\`G\`** — включить / поставить на паузу автопилот *(перенастраивается в настройках управления)*
          * **\`H\`** — открыть меню автопилота *(ввод координат, вставка F3+C и вейпоинтов Xaero из буфера, недавние цели, настройки)*
          * **\`/gp <x> <z>\`** или **\`/gp <x> <y> <z>\`** — задать координаты и полететь (\`/gp stop\`, \`/gp resume\`, \`/gp clear\`, \`/gp altitude <y|auto>\`, \`/gp clearance <блоки>\`, \`/gp freelook <true|false>\`, \`/gp descend <true|false>\`, \`/gp status\`)

          ### Установка
          Поместите \`happy-ghast-autopilot-${mod_version}.jar\` в папку \`.minecraft/mods/\` (требуются Fabric Loader 0.19.5+ и Fabric API для Minecraft 26.3; для выбора точки на карте — Xaero's World Map для 26.3).

          \`SHA-256: ${sha}\`
          EOF
          sed -i 's/^          //' release-notes.md

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$artifact" --clobber --repo "$GITHUB_REPOSITORY" > release.log 2>&1 \
              && gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
                --title "Happy Ghast Autopilot ${mod_version} for Minecraft ${minecraft_version}" \
                --notes-file release-notes.md >> release.log 2>&1
            st=$?
          else
            gh release create "$release_tag" "$artifact" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Happy Ghast Autopilot ${mod_version} for Minecraft ${minecraft_version}" \
              --notes-file release-notes.md > release.log 2>&1
            st=$?
          fi
          cat release.log
          if [ "$st" -ne 0 ]; then
            python3 -c "import pathlib; t=pathlib.Path('release.log').read_text(errors='replace')[-3000:]; print('::error title=Release failed::'+t.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))"
            exit "$st"
          fi
